spring.application.name=SmartPark-Campus

# Use in-memory DB for tests
spring.datasource.url=jdbc:h2:mem:smartpark_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT (must be long enough for HS512)
jwt.secret=mySecretKeyForJWTTokenGenerationAndValidationPurposesOnlyPleaseDontShareThis
jwt.expiration=86400000
